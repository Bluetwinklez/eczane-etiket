<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eczanem Programı</title>
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function () {
      try {
        if (localStorage.getItem('eczanem-tema') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <h2>Eczanem Programı</h2>
      <button id="cp-ac-btn" class="secondary" style="margin:0 10px 8px;text-align:left;background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.75)">🔍 Hızlı ara <span style="float:right;opacity:0.6">Ctrl+K</span></button>
      <nav id="nav"></nav>
      <div class="user-box">
        <div id="user-name">-</div>
        <div class="rol" id="user-rol">-</div>
        <button id="tema-btn" class="secondary">🌙 Karanlık Tema</button>
        <button id="sifre-btn" class="secondary">🔑 Şifremi Değiştir</button>
        <button id="logout-btn" class="secondary">Çıkış Yap</button>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <h1 id="page-title">Yükleniyor...</h1>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/ilaclar.js"></script>
  <script src="js/views/stok.js"></script>
  <script src="js/views/satis.js"></script>
  <script src="js/views/musteriler.js"></script>
  <script src="js/views/tedarikciler.js"></script>
  <script src="js/views/raporlar.js"></script>
  <script src="js/views/kullanicilar.js"></script>
  <script src="js/views/subeler.js"></script>
  <script src="js/views/bildirimler.js"></script>
  <script src="js/views/yedekleme.js"></script>
  <script src="js/views/kasaKapanisi.js"></script>
  <script src="js/views/giderler.js"></script>
  <script src="js/views/kampanyalar.js"></script>
  <script src="js/views/siparisler.js"></script>
  <script src="js/views/gorevler.js"></script>
  <script src="js/views/nobetler.js"></script>
  <script src="js/views/islemKaydi.js"></script>
  <script src="js/commandPalette.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
