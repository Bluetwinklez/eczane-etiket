[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eczane-etiket"
version = "1.6.0"
description = "Türkiye'deki eczaneler için modern, hızlı ve %100 çevrimdışı termal ilaç etiketi basım sistemi"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Bluetwinklez" }
]
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/Bluetwinklez/eczane-etiket"
Repository = "https://github.com/Bluetwinklez/eczane-etiket.git"
Issues = "https://github.com/Bluetwinklez/eczane-etiket/issues"

[project.scripts]
eczane-etiket = "run_app:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
