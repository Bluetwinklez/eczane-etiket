name: Eczam iPhone TestFlight

# Modlar (Actions → Eczam iPhone TestFlight → Run workflow):
#   upload=true  (varsayılan)  derle, imzala ve TestFlight'a yükle
#   upload=false               yalnızca derle ve imzala (yükleme yok)
#   provision_only=true        yalnızca imzalama/kimlik kurulumu (derleme yok)
# "ios-v*" etiketi (örn. ios-v1.0.0) itildiğinde yükleme modunda çalışır.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'TestFlight''a yükle (kapalı = yalnızca derle ve imzala)'
        type: boolean
        default: true
      provision_only:
        description: 'Yalnızca imzalama kurulumunu çalıştır (derleme yok)'
        type: boolean
        default: false
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  BUNDLE_ID: com.bluetwinklez.eczam

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Gerekli secret'ları denetle
        env:
          IOS_APPSTORE_P12_BASE64: ${{ secrets.IOS_APPSTORE_P12_BASE64 }}
          IOS_APPSTORE_P12_PASSWORD: ${{ secrets.IOS_APPSTORE_P12_PASSWORD }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
        run: |
          for name in IOS_APPSTORE_P12_BASE64 IOS_APPSTORE_P12_PASSWORD IOS_BUNDLE_ID IOS_TEAM_ID ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_PRIVATE_KEY_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Eksik repo secret'ı: $name"
              exit 1
            fi
          done
          # Xcode projesindeki bundle ID ile secret aynı olmalı.
          [[ "$IOS_BUNDLE_ID" == "$BUNDLE_ID" ]] || { echo "::error::IOS_BUNDLE_ID Xcode projesindeki ($BUNDLE_ID) ile aynı değil"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Bağımlılıkları kur ve testleri çalıştır
        run: |
          (cd web && npm ci && npm test)
          cd mobil-uygulama
          npm ci
          npm test
          npm run senkron

      - name: Dağıtım sertifikasını kur
        env:
          IOS_APPSTORE_P12_BASE64: ${{ secrets.IOS_APPSTORE_P12_BASE64 }}
          IOS_APPSTORE_P12_PASSWORD: ${{ secrets.IOS_APPSTORE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$IOS_APPSTORE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/signing.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -P "$IOS_APPSTORE_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -q 'Apple Distribution:' || { echo '::error::P12 içinde Apple Distribution imzalama kimliği olmalı'; exit 1; }
          serial="$(security find-certificate -a -c 'Apple Distribution' -p "$keychain" | openssl x509 -noout -serial | cut -d= -f2)"
          echo "CERT_SERIAL=$serial" >> "$GITHUB_ENV"

      # Bundle ID ve App Store profili API ile her çalıştırmada kurulur.
      # Admin anahtarı yoksa SIGNING_MODE=legacy olur ve saklı profil kullanılır.
      - name: İmzalama profilini oluştur
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
          # İsteğe bağlı Admin anahtarı (.p8 dosyasının metni olduğu gibi);
          # yalnızca imzalama kurulumunda kullanılır, yükleme üstteki anahtarla yapılır.
          ASC_ADMIN_KEY_ID: ${{ secrets.ASC_ADMIN_KEY_ID }}
          ASC_ADMIN_PRIVATE_KEY: ${{ secrets.ASC_ADMIN_PRIVATE_KEY }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages --quiet pyjwt cryptography
          key="$RUNNER_TEMP/asc_key.p8"
          echo "Admin anahtarı: id=$([[ -n "$ASC_ADMIN_KEY_ID" ]] && echo var || echo yok) key=$([[ -n "$ASC_ADMIN_PRIVATE_KEY" ]] && echo var || echo yok)"
          if [[ -n "$ASC_ADMIN_KEY_ID" && -n "$ASC_ADMIN_PRIVATE_KEY" ]]; then
            echo "İmzalama kurulumu için Admin anahtarı kullanılıyor"
            printf '%s\n' "$ASC_ADMIN_PRIVATE_KEY" > "$key"
            export ASC_API_KEY_ID="$ASC_ADMIN_KEY_ID"
          else
            printf '%s' "$ASC_API_PRIVATE_KEY_BASE64" | base64 -D > "$key"
          fi
          export ASC_API_PRIVATE_KEY_PATH="$key"
          export PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles:$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          python3 tool/asc_provision.py 2>&1 | tee "$RUNNER_TEMP/provision.log"
          rm -f "$key"
          { echo '### İmzalama kurulumu'; echo '```'; cat "$RUNNER_TEMP/provision.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ inputs.provision_only }}" == "true" ]]; then echo "STOP_AFTER_PROVISION=1" >> "$GITHUB_ENV"; fi

      # Admin anahtarı yoksa profil oluşturulamaz: App Store profilini
      # (Apple Developer'dan indirilen) repo secret'ından kurar.
      - name: Saklı App Store profiline dön
        if: env.SIGNING_MODE == 'legacy' && env.STOP_AFTER_PROVISION != '1'
        env:
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          [[ -n "$IOS_APPSTORE_PROFILE_BASE64" ]] || { echo '::error::Eksik repo secret'"'"'ı: IOS_APPSTORE_PROFILE_BASE64 (Admin anahtarı da yok)'; exit 1; }
          printf '%s' "$IOS_APPSTORE_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/signing.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/signing.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          profile_value() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/profile.plist"; }
          profile_uuid="$(profile_value UUID)"
          profile_name="$(profile_value Name)"
          [[ "$(profile_value TeamIdentifier:0)" == "$IOS_TEAM_ID" ]] || { echo '::error::Profildeki takım IOS_TEAM_ID ile uyuşmuyor'; exit 1; }
          [[ "$(profile_value Entitlements:application-identifier)" == "$IOS_TEAM_ID.$IOS_BUNDLE_ID" ]] || { echo '::error::Profildeki uygulama kimliği IOS_BUNDLE_ID ile uyuşmuyor'; exit 1; }
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/signing.mobileprovision" "$dir/$profile_uuid.mobileprovision"
          done
          echo "APP_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/signing.mobileprovision" "$RUNNER_TEMP/profile.plist"

      - name: Arşivle ve imzalı IPA üret
        if: env.STOP_AFTER_PROVISION != '1'
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          gem list -i xcodeproj >/dev/null 2>&1 || gem install --user-install --no-document xcodeproj
          export PATH="$(ruby -e 'puts Gem.user_dir')/bin:$PATH"
          surum="$(node -p "require('./mobil-uygulama/package.json').version")"
          ruby tool/ios_signing.rb mobil-uygulama/ios/App/App.xcodeproj "$IOS_TEAM_ID" "$APP_PROFILE_NAME" "$IOS_BUNDLE_ID" "$GITHUB_RUN_NUMBER" "$surum"
          xcodebuild archive \
            -project mobil-uygulama/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Eczam.xcarchive"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>$IOS_BUNDLE_ID</key><string>$APP_PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Eczam.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/ipa
          find build/ios/ipa -maxdepth 1 -name '*.ipa' -type f | grep -q .

      - name: TestFlight için App Store Connect'e yükle
        if: ${{ env.STOP_AFTER_PROVISION != '1' && (github.event_name != 'workflow_dispatch' || inputs.upload) }}
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.private_keys"
          chmod 700 "$HOME/.private_keys"
          printf '%s' "$ASC_API_PRIVATE_KEY_BASE64" | base64 -D > "$HOME/.private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 600 "$HOME/.private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          ipa="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -type f -print -quit)"
          [[ -n "$ipa" ]] || { echo '::error::IPA bulunamadı'; exit 1; }
          xcrun altool --upload-app --type ios -f "$ipa" --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Geçici imzalama dosyalarını sil
        if: always()
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/asc_key.p8" "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/signing.mobileprovision" "$RUNNER_TEMP/profile.plist"
          if [[ -n "${ASC_API_KEY_ID:-}" ]]; then
            rm -f "$HOME/.private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          fi
