name: iOS derleme kontrolü

# İmzasız iOS derlemesi: yerel kabuk (Swift Paketleri dahil) derleniyor mu?
# Hiçbir şey yayınlanmaz; secret gerekmez.
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobil-uygulama/**'
      - '.github/workflows/ios-compile.yml'

permissions:
  contents: read

concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobil-uygulama
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x

      - name: Bağımlılıkları kur
        run: |
          npm ci
          npm run senkron

      - name: iOS cihazı için derle (imzasız)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
