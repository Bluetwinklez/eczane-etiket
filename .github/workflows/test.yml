name: Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Linux GUI Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xvfb

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Configure Tcl/Tk for Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $searchDir = $env:pythonLocation
        if (-not $searchDir -or -not (Test-Path $searchDir)) {
            $searchDir = Split-Path (Get-Command python).Source
        }
        $initTcl = Get-ChildItem -Path $searchDir -Filter "init.tcl" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($initTcl) {
            $tclDir = $initTcl.DirectoryName
            "TCL_LIBRARY=$tclDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Found TCL_LIBRARY: $tclDir"
        }
        $tkTcl = Get-ChildItem -Path $searchDir -Filter "tk.tcl" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($tkTcl) {
            $tkDir = $tkTcl.DirectoryName
            "TK_LIBRARY=$tkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Found TK_LIBRARY: $tkDir"
        }

    - name: Run Pytest (Windows)
      if: runner.os == 'Windows'
      run: |
        python -m pytest -v

    - name: Run Pytest with Xvfb (Linux)
      if: runner.os == 'Linux'
      run: |
        xvfb-run -a python -m pytest -v
