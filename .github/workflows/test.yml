name: Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Linux GUI Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xvfb

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Configure Tcl/Tk for Windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "TCL_LIBRARY=$(python -c 'import sys, os; print(os.path.join(sys.base_prefix, "tcl", "tcl8.6"))')" >> $GITHUB_ENV
        echo "TK_LIBRARY=$(python -c 'import sys, os; print(os.path.join(sys.base_prefix, "tcl", "tk8.6"))')" >> $GITHUB_ENV

    - name: Run Pytest (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Continue"
        python -m pytest -v --tb=short 2>&1 | Tee-Object -FilePath win_pytest_log.txt
        $exitCode = $LASTEXITCODE
        if ($exitCode -ne 0) {
            $errLines = Get-Content win_pytest_log.txt | Where-Object { $_ -match "FAILED" -or $_ -match "ERROR" -or $_ -match "Error:" -or $_ -match "TclError" } | Select-Object -First 10
            foreach ($el in $errLines) {
                Write-Host "::error title=PytestFailure::$el"
            }
            $lastLines = Get-Content win_pytest_log.txt | Select-Object -Last 20
            foreach ($ll in $lastLines) {
                Write-Host "::warning title=PytestSummary::$ll"
            }
            exit $exitCode
        }

    - name: Run Pytest with Xvfb (Linux)
      if: runner.os == 'Linux'
      run: |
        xvfb-run -a python -m pytest -v
