<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eczam Programı</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function () {
      try {
        var tema = localStorage.getItem('eczanem-tema');
        var sistemKoyu = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (tema === 'dark' || (tema === 'sistem' && sistemKoyu)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        var yazi = localStorage.getItem('eczanem-yazi');
        if (yazi === 'kucuk' || yazi === 'buyuk') document.documentElement.setAttribute('data-yazi', yazi);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-marka"><span id="logo-yer"></span><h2>Eczam<small>Programı</small></h2></div>
      <button id="cp-ac-btn" class="cp-ac" type="button"><span id="cp-ikon"></span>Hızlı ara <kbd>Ctrl+K</kbd></button>
      <nav id="nav"></nav>
    </aside>
    <div class="main">
      <div class="topbar">
        <button class="ikon-btn menu-ac" id="menu-ac-btn" type="button" aria-label="Menüyü aç" aria-controls="nav"></button>
        <h1 id="page-title">Yükleniyor...</h1>
        <div class="topbar-sag">
          <div class="zil-kutu">
            <button class="ikon-btn zil-btn" id="zil-btn" aria-label="Bildirim merkezi" title="Bildirim merkezi"><span id="zil-ikon"></span><span class="zil-sayi" id="zil-sayi" hidden>0</span></button>
            <div class="zil-panel" id="zil-panel" hidden></div>
          </div>
          <div class="kullanici-kutu">
            <button class="kullanici-cip" id="kullanici-btn" type="button" aria-haspopup="menu" aria-expanded="false">
              <span class="kc-metin"><span id="user-name">-</span><span class="rol" id="user-rol">-</span></span>
              <span class="avatar" id="user-avatar">?</span>
            </button>
            <div class="kullanici-menu" id="kullanici-menu" role="menu" hidden>
              <button id="tema-btn" type="button" role="menuitem">Karanlık Tema</button>
              <button id="gorunum-btn" type="button" role="menuitem">Görünüm Ayarları</button>
              <button id="kisayol-btn" type="button" role="menuitem">Klavye Kısayolları</button>
              <button id="kilitle-btn" type="button" role="menuitem">Ekranı Kilitle</button>
              <button id="sifre-btn" type="button" role="menuitem">Şifremi Değiştir</button>
              <hr />
              <button id="logout-btn" type="button" role="menuitem">Çıkış Yap</button>
            </div>
          </div>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
  <div class="cekmece-perde" id="cekmece-perde"></div>
  <nav class="alt-cubuk" id="alt-cubuk" aria-label="Hızlı gezinme"></nav>
  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="js/hataYakala.js"></script>
